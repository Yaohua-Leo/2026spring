<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICCM 2026 Conference Handbook</title>
  <style>
{{ STYLES }}
  </style>
  <script>
    window.__HANDBOOK_READY__ = false;
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'none' },
      startup: {
        ready: () => {
          MathJax.startup.defaultReady();
          MathJax.startup.promise.then(() => {
            window.__HANDBOOK_READY__ = true;
          });
        }
      }
    };

    window.addEventListener('load', () => {
      window.setTimeout(() => {
        if (window.__HANDBOOK_READY__ !== true) {
          window.__HANDBOOK_READY__ = true;
        }
      }, 8000);
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <main class="handbook">
{{ CONTENT }}
  </main>
</body>
</html>
